[project]
name = "kestrel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "ninja"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kestrel*"]

[tool.setuptools.package-data]
kestrel = ["csrc/*.cu"]
